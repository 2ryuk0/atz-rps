<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ATEEZ RPS 취향표</title>
  <style>
    @font-face {
      font-family: 'GmarketSans';
      src: url('./GmarketSansLight.otf') format('opentype');
      font-weight: 300;
    }
    @font-face {
      font-family: 'GmarketSans';
      src: url('./GmarketSansMedium.otf') format('opentype');
      font-weight: 500;
    }
    @font-face {
      font-family: 'GmarketSans';
      src: url('./GmarketSansBold.otf') format('opentype');
      font-weight: 700;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'GmarketSans', sans-serif;
      font-weight: 300;
      text-align: center;
      background: #ffffff;
      margin: 20px;
      padding-right: 70px; /* 우측 슬라이더 공간 확보 */
    }

    .buttons {
      margin-bottom: 20px;
    }

    button {
      padding: 10px 16px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    .otp { background: #ff4a4b; }
    .interest { background: #ffc83d; color: black; }
    .like { background: #38e1f2; color: black; }
    .okay { background: #3dc451; }
    .follow { background: #b96bff; }
    .danger { background: #000; }

    .custom-adder {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 5px;
      padding: 4px 8px;
      border: 1px dashed #ccc;
      border-radius: 10px;
      vertical-align: middle;
    }

    .custom-adder input[type="color"] {
      width: 30px;
      height: 30px;
      padding: 0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: none;
    }

    .custom-adder input[type="text"] {
      width: 80px;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: 'GmarketSans', sans-serif;
      font-weight: 500;
      font-size: 13px;
    }

    .add-btn {
      background: #555 !important;
      color: white;
      font-size: 13px;
      padding: 8px 10px !important;
    }

    .table-wrap {
      display: inline-block;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #ddd;
    }

    table {
      margin: 0 auto;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      min-width: 50px;
      text-align: center;
      cursor: pointer;
      font-family: 'GmarketSans', sans-serif;
      font-weight: 500;
      transition: background-color 0.15s ease;
    }

    th {
      background: #f2f2f2;
      font-weight: 500;
    }

    .col-header {
      font-weight: 700;
    }

    .memo-box {
      display: block;
      margin: 30px auto 0;
      width: 500px;
      max-width: 90%;
      height: 180px;
      padding: 16px;
      font-family: 'GmarketSans', sans-serif;
      font-weight: 300;
      font-size: 15px;
      line-height: 1.5;
      color: #333;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 16px;
      resize: vertical;
      outline: none;
    }

    .memo-box:focus {
      border-color: #b0b0b0;
    }

    #captureArea {
      display: inline-block;
      background: #ffffff;
      padding: 10px;
    }

    .save-btn {
      display: block;
      margin: 16px auto 40px;
      background: #333 !important;
      color: white;
      font-size: 15px;
      padding: 12px 20px !important;
      border-radius: 12px !important;
    }

    td:hover {
      filter: brightness(0.97);
    }

    /* 우측 세로 불투명도 슬라이더 */
    .opacity-panel {
      position: fixed;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-family: inherit;
    }

    .opacity-panel label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
    }

    .opacity-value {
      font-size: 12px;
      color: #888;
    }

    .opacity-slider {
      writing-mode: vertical-lr;
      direction: rtl;
      width: 8px;
      height: 160px;
      appearance: slider-vertical; /* Firefox 대응 */
      accent-color: #444;
      cursor: pointer;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <h2>ATEEZ RPS 취향표</h2>

  <div class="buttons" id="buttonGroup">
    <button class="otp" data-color="#ff4a4b">OTP</button>
    <button class="interest" data-color="#ffc83d">관심있음</button>
    <button class="okay" data-color="#3dc451">호감</button>
    <button class="like" data-color="#38e1f2">괜찮음</button>
    <button class="follow" data-color="#b96bff">캐해 따라</button>
    <button class="danger" data-color="#000000">지뢰</button>
    <span class="custom-adder">
      <input type="color" id="customColorPicker" value="#888888" title="색상 선택">
      <input type="text" id="customLabelInput" placeholder="칸 이름" maxlength="10">
      <button type="button" class="add-btn" id="addCustomBtn">+ 추가</button>
    </span>
  </div>

  <div id="captureArea">
    <div class="table-wrap">
    <table>
      <tr>
        <th></th>
        <th class="col-header">홍중</th>
        <th class="col-header">성화</th>
        <th class="col-header">윤호</th>
        <th class="col-header">여상</th>
        <th class="col-header">산</th>
        <th class="col-header">민기</th>
        <th class="col-header">우영</th>
        <th class="col-header">종호</th>
      </tr>
      <tr><th class="col-header">홍중</th><td></td><td>성홍</td><td>윤몽</td><td>솽홍</td><td>낫홍</td><td>솜몽</td><td>웡홍</td><td>쫑홍</td></tr>
      <tr><th class="col-header">성화</th><td>홍섷</td><td></td><td>윤섷</td><td>솽섷</td><td>낫섷</td><td>밍섷</td><td>웡섷</td><td>쫑섷</td></tr>
      <tr><th class="col-header">윤호</th><td>몽윤</td><td>섷윤</td><td></td><td>솽윦</td><td>낫윤</td><td>밍윦</td><td>웡윤</td><td>쫑윦</td></tr>
      <tr><th class="col-header">여상</th><td>홍솽</td><td>섷솽</td><td>윦여</td><td></td><td>낫여</td><td>솜여</td><td>웡상</td><td>쫑상</td></tr>
      <tr><th class="col-header">산</th><td>홍낫</td><td>섷낫</td><td>윤낫</td><td>여낫</td><td></td><td>밍낫</td><td>웡낫</td><td>쫑낫</td></tr>
      <tr><th class="col-header">민기</th><td>홍솜</td><td>섷밍</td><td>윦밍</td><td>솽밍</td><td>낫밍</td><td></td><td>웡밍</td><td>쫑밍</td></tr>
      <tr><th class="col-header">우영</th><td>홍웡</td><td>섷웡</td><td>윤웡</td><td>상웡</td><td>낫웡</td><td>밍웡</td><td></td><td>쫑웡</td></tr>
      <tr><th class="col-header">종호</th><td>홍쫑</td><td>섷쫑</td><td>윤쫑</td><td>솽쫑</td><td>낫쫑</td><td>솜쫑</td><td>웡쫑</td><td></td></tr>
    </table>
    </div>

    <textarea class="memo-box" placeholder="메모를 입력하세요..."></textarea>
  </div>

  <button type="button" id="saveImageBtn" class="save-btn">📷 사진 저장하기</button>

  <!-- 우측 세로 불투명도 슬라이더 -->
  <div class="opacity-panel">
    <label for="opacitySlider">불투명도</label>
    <input type="range" id="opacitySlider" class="opacity-slider" min="10" max="100" value="100" step="5">
    <span class="opacity-value" id="opacityValue">100%</span>
  </div>

  <script>
    let selectedColor = null; // hex, e.g. "#ff4a4b"
    let opacity = 1; // 0.1 ~ 1

    const opacitySlider = document.getElementById("opacitySlider");
    const opacityValue = document.getElementById("opacityValue");

    opacitySlider.addEventListener("input", () => {
      opacity = parseInt(opacitySlider.value, 10) / 100;
      opacityValue.textContent = opacitySlider.value + "%";
    });

    // 버튼 클릭 시 색상 선택 (동적으로 추가된 버튼도 함께 처리)
    const buttonGroup = document.getElementById("buttonGroup");

    buttonGroup.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-color]");
      if (!btn) return;

      selectedColor = btn.getAttribute("data-color");

      // 선택된 버튼 테두리 표시
      document.querySelectorAll("#buttonGroup button[data-color]").forEach(b => b.style.outline = "none");
      btn.style.outline = "3px solid black";
    });

    // 배경색 밝기에 따라 글자색(흰색/검정) 자동 결정
    function getContrastTextColor(hex) {
      const bigint = parseInt(hex.replace("#", ""), 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      const brightness = (r * 299 + g * 587 + b * 114) / 1000;
      return brightness > 150 ? "black" : "white";
    }

    // 커스텀 칸 추가
    const customColorPicker = document.getElementById("customColorPicker");
    const customLabelInput = document.getElementById("customLabelInput");
    const addCustomBtn = document.getElementById("addCustomBtn");
    const customAdder = document.querySelector(".custom-adder");

    addCustomBtn.addEventListener("click", () => {
      const color = customColorPicker.value;
      const label = customLabelInput.value.trim();

      if (!label) {
        alert("칸 이름을 입력해주세요!");
        return;
      }

      const newBtn = document.createElement("button");
      newBtn.textContent = label;
      newBtn.setAttribute("data-color", color);
      newBtn.style.background = color;
      newBtn.style.color = getContrastTextColor(color);

      // 새 버튼을 "추가" UI 앞에 삽입
      customAdder.parentNode.insertBefore(newBtn, customAdder);

      customLabelInput.value = "";
    });

    // 엔터 키로도 추가 가능하게
    customLabelInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addCustomBtn.click();
    });

    // 사진 저장하기 (표 + 메모만, 버튼/불투명도 슬라이더는 제외)
    const saveImageBtn = document.getElementById("saveImageBtn");

    saveImageBtn.addEventListener("click", () => {
      const memoBox = document.querySelector(".memo-box");
      const memoText = memoBox.value;

      // textarea는 캡처 시 값이 제대로 안 찍히는 경우가 있어
      // 같은 스타일의 div로 잠깐 바꿔치기 해서 캡처함
      const memoDiv = document.createElement("div");
      memoDiv.className = "memo-box";
      memoDiv.style.whiteSpace = "pre-wrap";
      memoDiv.style.textAlign = "left";
      memoDiv.style.overflow = "hidden";
      memoDiv.textContent = memoText;

      memoBox.style.display = "none";
      memoBox.parentNode.insertBefore(memoDiv, memoBox);

      html2canvas(document.getElementById("captureArea"), {
        backgroundColor: "#ffffff",
        scale: 2
      }).then(canvas => {
        // 원래 textarea로 복구
        memoDiv.remove();
        memoBox.style.display = "";

        const link = document.createElement("a");
        link.download = "ateez_rps_취향표.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    });

    // hex -> rgba 변환
    function hexToRgba(hex, alpha) {
      const bigint = parseInt(hex.replace("#", ""), 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // 비교용: 색상값을 통일된 rgba 형태로 변환
    function toRGBA(color) {
      const temp = document.createElement("div");
      temp.style.color = color;
      document.body.appendChild(temp);
      const rgba = getComputedStyle(temp).color;
      document.body.removeChild(temp);
      return rgba;
    }

    // 셀 클릭 시 색칠 / 같은 색+투명도면 제거
    document.querySelectorAll("td").forEach(cell => {
      cell.addEventListener("click", () => {
        if (!selectedColor) return;

        const targetColor = hexToRgba(selectedColor, opacity);
        const current = getComputedStyle(cell).backgroundColor;
        const target = toRGBA(targetColor);

        if (current === target) {
          cell.style.backgroundColor = "";
        } else {
          cell.style.backgroundColor = targetColor;
        }
      });
    });
  </script>
</body>
</html>
