<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ATEEZ RPS 취향표</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f8f8f8;
      margin: 20px;
    }

    .buttons {
      margin-bottom: 20px;
    }

    button {
      padding: 10px 16px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .otp { background: #ff4a4b; }       /* 빨강 */
    .interest { background: #ffc83d; color: black; } /* 노랑 */
    .like { background: #38e1f2; color: black; }     /* 파랑 */
    .okay { background: #3dc451; }      /* 초록 */
    .neutral { background: #b0b0b0; color: black; }  /* 회색 */
    .follow { background: #b96bff; }    /* 보라 */
    .danger { background: #000; }       /* 검정 */

    table {
      margin: 0 auto;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      min-width: 50px;
      text-align: center;
      cursor: pointer;
    }

    th {
      background: #eee;
    }
  </style>
</head>
<body>
  <h2>ATEEZ RPS 취향표</h2>

  <div class="buttons">
    <button class="otp" data-color="#ff4a4b">OTP</button>
    <button class="interest" data-color="#ffc83d">관심있음</button>
    <button class="okay" data-color="#3dc451">호감</button>
    <button class="like" data-color="#38e1f2">괜찮음</button>
    <button class="neutral" data-color="#b0b0b0">별생각 없음</button>
    <button class="follow" data-color="#b96bff">캐해 따라</button>
    <button class="danger" data-color="#000000">지뢰</button>
  </div>

  <table>
    <tr>
      <th></th>
      <th>홍중</th>
      <th>성화</th>
      <th>윤호</th>
      <th>여상</th>
      <th>산</th>
      <th>민기</th>
      <th>우영</th>
      <th>종호</th>
    </tr>
    <tr><th>홍중</th><td></td><td>성홍</td><td>윤몽</td><td>솽홍</td><td>낫홍</td><td>솜몽</td><td>웡홍</td><td>쫑홍</td></tr>
    <tr><th>성화</th><td>홍섷</td><td></td><td>윤섷</td><td>솽섷</td><td>낫섷</td><td>밍섷</td><td>웡섷</td><td>쫑섷</td></tr>
    <tr><th>윤호</th><td>몽윤</td><td>섷윤</td><td></td><td>솽윦</td><td>낫윤</td><td>밍윦</td><td>웡윤</td><td>쫑윦</td></tr>
    <tr><th>여상</th><td>홍솽</td><td>섷솽</td><td>윦여</td><td></td><td>낫여</td><td>솜여</td><td>웡상</td><td>쫑상</td></tr>
    <tr><th>산</th><td>홍낫</td><td>섷낫</td><td>윤낫</td><td>여낫</td><td></td><td>밍낫</td><td>웡낫</td><td>쫑낫</td></tr>
    <tr><th>민기</th><td>홍솜</td><td>섷밍</td><td>윦밍</td><td>솽밍</td><td>낫밍</td><td></td><td>웡밍</td><td>쫑밍</td></tr>
    <tr><th>우영</th><td>홍웡</td><td>섷웡</td><td>윤웡</td><td>상웡</td><td>낫웡</td><td>밍웡</td><td></td><td>쫑웡</td></tr>
    <tr><th>종호</th><td>홍쫑</td><td>섷쫑</td><td>윤쫑</td><td>솽쫑</td><td>낫쫑</td><td>솜쫑</td><td>웡쫑</td><td></td></tr>
  </table>

  <script>
    let selectedColor = null;

    // 버튼 클릭 시 색상 선택
    document.querySelectorAll(".buttons button").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedColor = btn.getAttribute("data-color");

        // 선택된 버튼 테두리 표시
        document.querySelectorAll(".buttons button").forEach(b => b.style.outline = "none");
        btn.style.outline = "3px solid black";
      });
    });

    // 색상값을 통일된 rgb 형태로 변환 (비교용)
    function toRGB(color) {
      const temp = document.createElement("div");
      temp.style.color = color;
      document.body.appendChild(temp);
      const rgb = getComputedStyle(temp).color;
      document.body.removeChild(temp);
      return rgb;
    }

    // 셀 클릭 시 색칠 / 같은 색이면 제거
    document.querySelectorAll("td").forEach(cell => {
      cell.addEventListener("click", () => {
        if (!selectedColor) return;
        const current = getComputedStyle(cell).backgroundColor;
        const target = toRGB(selectedColor);
        if (current === target) {
          cell.style.backgroundColor = "";
        } else {
          cell.style.backgroundColor = selectedColor;
        }
      });
    });
  </script>
</body>
</html>
